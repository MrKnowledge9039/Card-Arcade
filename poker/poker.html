<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker</title>
  <link rel="shortcut icon" href="img\favicon.png" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="title">
    <h1>Poker</h1>
  </div>
  <div id="poker-board">
    <div id="test1">
      <div id="test2">
        <canvas id="poker-canvas" width="80" height="60"></canvas>
      </div>
    </div>
  </div>
  <div class="player">
    <div class="visuals">
      <div class="poker-cards">
        <div id="img1" class="img-w">
          <img class="img" src="../cards/10-clubs.png">
          <div class="shadow"></div>
        </div>
        <div id="img2" class="img-w">
          <img class="img" src="../cards/10-diamonds.png">
          <div class="shadow"></div>
        </div>
      </div>
      <div class="chips">
        <div id="chips-c">
          <div class="chip-stack s-0">
            <img id="w-c-0" class="chip c-0" src="../chips/white_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/white_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/white_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/white_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/white_chip.png">
          </div>
          <div class="chip-stack s-1">
            <img id="w-c-0" class="chip c-0" src="../chips/white_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/white_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/white_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/white_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/white_chip.png">
          </div>
          <div class="chip-stack s-2">
            <img id="w-c-0" class="chip c-0" src="../chips/green_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/green_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/green_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/green_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/green_chip.png">
          </div>
          <div class="chip-stack s-3">
            <img id="w-c-0" class="chip c-0" src="../chips/red_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/red_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/red_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/red_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/red_chip.png">
          </div>
          <div class="chip-stack s-4">
            <img id="w-c-0" class="chip c-0" src="../chips/red_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/red_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/red_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/red_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/red_chip.png">
          </div>
          <div class="chip-stack s-5">
            <img id="w-c-0" class="chip c-0" src="../chips/blue_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/blue_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/blue_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/blue_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/blue_chip.png">
          </div>
          <div class="chip-stack s-6">
            <img id="w-c-0" class="chip c-0" src="../chips/black_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/black_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/black_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/black_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/black_chip.png">
          </div>
          <div class="chip-stack s-7">
            <img id="w-c-0" class="chip c-0" src="../chips/red_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/red_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/red_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/red_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/red_chip.png">
          </div>
          <div class="chip-stack s-8">
            <img id="w-c-0" class="chip c-0" src="../chips/blue_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/blue_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/blue_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/blue_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/blue_chip.png">
          </div>
          <div class="chip-stack s-9">
            <img id="w-c-0" class="chip c-0" src="../chips/black_chip.png">
            <img id="w-c-1" class="chip c-1" src="../chips/black_chip.png">
            <img id="w-c-2" class="chip c-2" src="../chips/black_chip.png">
            <img id="w-c-3" class="chip c-3" src="../chips/black_chip.png">
            <img id="w-c-4" class="chip c-4" src="../chips/black_chip.png">
          </div>
        </div>
      </div>
    </div>
    <div class="name">Player 1</div>
    <div class="score">1450</div>
  </div>
</body>

<script src="poker.js"></script>

</html>
